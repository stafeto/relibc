# POSIX header spec: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/sched.h.html
#
# Spec quotations relating to includes:
# - "The <sched.h> header shall define the pid_t type as described in <sys/types.h>."
# - "The <sched.h> header shall define the time_t type as described in <sys/types.h>."
# - "The <sched.h> header shall define the timespec structure as described in <time.h>."
# - "Inclusion of the <sched.h> header may make visible all symbols from the <time.h> header."
#
# bits/timespec.h brings in time_t
include_guard = "_RELIBC_SCHED_H"
after_includes = """
#include <bits/pid-t.h>    // for pid_t from sys/types
#include <bits/timespec.h> // for timespec from time.h
#include <stddef.h>        // for size_t, which the CPU set macros use
"""
trailer = """
typedef struct cpu_set_t cpu_set_t;
/* glibc's macros for the sets of CPUs. */
#define CPU_ZERO(set) \\
    do { \\
        unsigned long *__w = (unsigned long *)(set); \\
        for (int __i = 0; __i < CPU_SETSIZE / (8 * (int)sizeof(unsigned long)); __i++) __w[__i] = 0; \\
    } while (0)
#define CPU_SET(cpu, set) \\
    (((unsigned long *)(set))[(cpu) / (8 * sizeof(unsigned long))] |= 1UL << ((cpu) % (8 * sizeof(unsigned long))))
#define CPU_CLR(cpu, set) \\
    (((unsigned long *)(set))[(cpu) / (8 * sizeof(unsigned long))] &= ~(1UL << ((cpu) % (8 * sizeof(unsigned long)))))
#define CPU_ISSET(cpu, set) \\
    ((((const unsigned long *)(set))[(cpu) / (8 * sizeof(unsigned long))] >> ((cpu) % (8 * sizeof(unsigned long)))) & 1UL)
#define CPU_COUNT(set) \\
    ({ int __n = 0; \\
       for (int __i = 0; __i < CPU_SETSIZE / (8 * (int)sizeof(unsigned long)); __i++) \\
           __n += __builtin_popcountl(((const unsigned long *)(set))[__i]); \\
       __n; })
"""
language = "C"
style = "Tag"
no_includes = true
usize_is_size_t = true
cpp_compat = true

[enum]
prefix_with_name = true

[export]
include = ["sched_param", "cpu_set_t"]

[export.rename]
"timespec" = "struct timespec"
