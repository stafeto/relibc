# POSIX header spec: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/iconv.h.html
#
# Spec quotations relating to includes:
# - "The <iconv.h> header shall define the size_t type as described in <stddef.h>."
sys_includes = ["stddef.h"]
include_guard = "_RELIBC_ICONV_H"
after_includes = """
typedef void *iconv_t;
"""
language = "C"
style = "Type"
no_includes = true
cpp_compat = true

[enum]
prefix_with_name = true
