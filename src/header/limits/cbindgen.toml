# POSIX header spec: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/limits.h.html
#
# There are no spec quotations relating to includes
include_guard = "_RELIBC_LIMITS_H"
after_includes = """
#include <bits/limits/ptdi.h> // for PTHREAD_DESTRUCTOR_ITERATIONS
#define PATH_MAX 512 // the stafeto layer's limit; PATH_MAX in mod.rs is the same
#define ARG_MAX 65536 // the stafeto layer's limit; ARG_MAX in mod.rs is the same
#define PIPE_BUF 512 // the stafeto pipe service's atomic write; PIPE_BUF in mod.rs is the same
#define SYMLINK_MAX 511 // the longest link the stafeto file service keeps; SYMLINK_MAX in mod.rs is the same
#define SYMLOOP_MAX 32 // the links the stafeto file service follows; SYMLOOP_MAX in mod.rs is the same
"""
language = "C"
no_includes = true
cpp_compat = true

[enum]
prefix_with_name = true

[export]
exclude = ["PATH_MAX", "ARG_MAX", "PIPE_BUF", "SYMLINK_MAX", "SYMLOOP_MAX"]
