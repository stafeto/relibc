# POSIX header spec: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/syslog.h.html
#
# There are no spec quotations relating to includes
include_guard = "_RELIBC_SYS_SYSLOG_H"
language = "C"
style = "Type"
no_includes = true
cpp_compat = true

after_includes = """

#define LOG_PRIMASK 0x07
#define LOG_FACMASK 0x03f8
#define LOG_PRI(p) ((p) & LOG_PRIMASK)
#define LOG_FAC(p) (((p) & LOG_FACMASK) >> 3)
#define LOG_MAKEPRI(fac, pri) ((fac) | (pri))

#ifdef SYSLOG_NAMES
typedef struct _code {
    char *c_name;
    int c_val;
} CODE;

static CODE prioritynames[] = {
    { "alert", 1 }, { "crit", 2 }, { "debug", 7 }, { "emerg", 0 }, { "err", 3 },
    { "error", 3 }, { "info", 6 }, { "notice", 5 }, { "panic", 0 }, { "warn", 4 },
    { "warning", 4 }, { 0, -1 }
};

static CODE facilitynames[] = {
    { "auth", 4 << 3 }, { "authpriv", 10 << 3 }, { "cron", 9 << 3 }, { "daemon", 3 << 3 },
    { "ftp", 11 << 3 }, { "kern", 0 << 3 }, { "lpr", 6 << 3 }, { "mail", 2 << 3 },
    { "news", 7 << 3 }, { "security", 4 << 3 }, { "syslog", 5 << 3 }, { "user", 1 << 3 },
    { "uucp", 8 << 3 }, { "local0", 16 << 3 }, { "local1", 17 << 3 }, { "local2", 18 << 3 },
    { "local3", 19 << 3 }, { "local4", 20 << 3 }, { "local5", 21 << 3 }, { "local6", 22 << 3 },
    { "local7", 23 << 3 }, { 0, -1 }
};
#endif
"""

[enum]
prefix_with_name = true
