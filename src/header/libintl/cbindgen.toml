# POSIX header spec: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/libintl.h.html
#
# Spec quotations relating to includes:
# - "The <libintl.h> header shall define the locale_t type as described in <locale.h>."
sys_includes = []
include_guard = "_RELIBC_LIBINTL_H"
after_includes = """
#include <bits/locale-t.h> // for locale_t
"""
language = "C"
style = "Tag"
no_includes = true
cpp_compat = true

[enum]
prefix_with_name = true
